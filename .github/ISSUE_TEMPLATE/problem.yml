name: Problem
description: Something in the app doesn't work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: In the app, Settings, About.
  - type: input
    id: device
    attributes:
      label: Phone and Android version
  - type: textarea
    id: more
    attributes:
      label: Screenshots or anything else
